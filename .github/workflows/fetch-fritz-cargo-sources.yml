name: Fetch pinned FRITZ!Power Monitor Cargo sources

on:
  push:
    branches:
      - add-fritz-power-monitor

permissions:
  contents: write

jobs:
  fetch-cargo-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-fritz-power-monitor
      - name: Fetch generated Cargo source manifest
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/gpkvt/cosmic-ext-fritzsmart-monitor-applet/f2237e55eb811e9d3fab94b85b315df3fe62f0e6/cargo-sources.json \
            -o app/com.gpkvt.FritzPowerMonitor/cargo-sources.json
          echo "de05f2c942d4f336fbc3b62aafc12629bda437105d3c35216c79abb29b62a1f6  app/com.gpkvt.FritzPowerMonitor/cargo-sources.json" | sha256sum --check
          rm .github/workflows/fetch-fritz-cargo-sources.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/com.gpkvt.FritzPowerMonitor/cargo-sources.json .github/workflows/fetch-fritz-cargo-sources.yml
          git commit -m "Add pinned FRITZ!Power Monitor Cargo sources"
          git push